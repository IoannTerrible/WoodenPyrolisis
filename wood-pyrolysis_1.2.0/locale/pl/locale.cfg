[item-name]
biochar=Biowęgiel

[item-description]
biochar=Bogate w węgiel paliwo stałe wytwarzane przez pirolizę drewna. Pali się podobnie do węgla.

[fluid-name]
pyrolysis-oil=Olej pirolityczny
wood-gas=Gaz drzewny
methanol=Metanol

[fluid-description]
pyrolysis-oil=Ciemny, lepki bioolej skondensowany z par pirolizy drewna. Może zastąpić pochodne ropy naftowej.
wood-gas=Palna mieszanina gazowa tlenku węgla, wodoru i lekkich węglowodorów uwalniana podczas pirolizy drewna.
methanol=Wysoce łatwopalny, bezbarwny alkohol otrzymywany przez destylację drewna. Stosowany jako rozpuszczalnik i surowiec do tworzyw sztucznych oraz paliw.

[technology-name]
wood-pyrolysis=Piroliza drewna

[technology-description]
wood-pyrolysis=Odblokowuje termiczny rozkład drewna i powiązany łańcuch chemiczny — syntezę Fischera-Tropscha, destylację bioleju, syntezę bakelitu i przemianę metanolu w paliwo.

[recipe-name]
wood-pyrolysis=Piroliza drewna
fischer-tropsch-synthesis=Synteza Fischera-Tropscha
bio-oil-distillation=Destylacja bioleju
methanol-plastic=Synteza bakelitu
methanol-solid-fuel=Metanol na paliwo

[recipe-description]
wood-pyrolysis=Termicznie rozkłada drewno bez dostępu tlenu, dając biowęgiel, olej pirolityczny i gaz drzewny.
fischer-tropsch-synthesis=Katalitycznie przekształca gaz syntezowy (CO i H₂ z gazu drzewnego) w ciekłe węglowodory. Proces Fischera-Tropscha jest stosowany przemysłowo od lat 20. XX wieku do produkcji paliw z surowców innych niż ropa.
bio-oil-distillation=Destylacja frakcyjna kwasu piroligninowego (smoły drzewnej). Oddziela ciężkie frakcje smoły od wodorozpuszczalnej części bogatej w metanol i kwas octowy, jak praktykowano w przemyśle destylacji drewna w XIX wieku.
methanol-plastic=Wytwarza żywicę fenolowo-formaldehydową typu bakelit. Metanol utlenia się do formaldehydu, który następnie kondensuje z fenolami ze smoły węglowej, tworząc pierwsze całkowicie syntetyczne tworzywo, wynalezione przez Leo Baekelanda w 1907 roku.
methanol-solid-fuel=Przekształca metanol w gęste paliwo syntetyczne procesem metanol-na-benzynę (MTG), opracowanym przez firmę Mobil w latach 70. XX wieku. Metanol jest odwadniany na katalizatorze zeolitowym, tworząc węglowodory nadające się jako paliwo stałe.

[factoriopedia-description]
biochar=Węglopodobne ciało stałe z wolnej pirolizy biomasy. Oprócz wartości opałowej biowęgiel od stuleci stosuje się jako środek poprawiający glebę.
pyrolysis-oil=Złożony, kwaśny bioolej zawierający setki związków. Przed zastąpieniem frakcji ropy wymaga destylacji.
wood-gas=Gaz drzewny napędzał miliony pojazdów w Europie podczas II wojny światowej, gdy benzyna była racjonowana. Jako gaz syntezowy bezpośrednio zasila syntezę Fischera-Tropscha.
methanol=Najprostszy alkohol i wszechstronny budulec chemiczny — zamienialny w tworzywo przez syntezę bakelitu lub w paliwo stałe przez proces MTG firmy Mobil.
tech-wood-pyrolysis=Piroliza drewna wyprzedza nowoczesną petrochemię o stulecia. Te badania otwierają pełną alternatywną gałąź chemiczną opartą na drewnie jako odnawialnym surowcu.
recipe-wood-pyrolysis=Przemysłowa piroliza zachodzi w temperaturze 400-600 °C w szczelnych retortach: biomasa wchodzi, biowęgiel, olej i gaz wychodzą. Brak tlenu uniemożliwia spalanie i wymusza rozkład.
recipe-fischer-tropsch-synthesis=Wynaleziona w 1925 roku; stosowana przez Niemcy w czasie II wojny światowej oraz przez RPA w okresie sankcji apartheidu do produkcji paliw ciekłych z gazu syntezowego z węgla i biomasy.
recipe-bio-oil-distillation=Historyczna nazwa „kwas piroligniczny" odzwierciedla wysoką zawartość kwasu octowego oddzielanego podczas destylacji frakcyjnej oleju pirolitycznego.
recipe-methanol-plastic=Metanol utlenia się do formaldehydu, który kondensuje z fenolami (tu reprezentowanymi przez węgiel) — chemia bakelitu Leo Baekelanda (1907), pierwszego całkowicie syntetycznego tworzywa.
recipe-methanol-solid-fuel=Proces MTG firmy Mobil (1976) przepuszcza metanol przez katalizator zeolitowy ZSM-5 w ~370 °C, dając węglowodory zakresu benzyny zestalające się w paliwo.
