[item-name]
biochar=Biocarbón

[item-description]
biochar=Combustible sólido rico en carbono producido por la pirólisis de madera. Arde de forma similar al carbón.

[fluid-name]
pyrolysis-oil=Aceite de pirólisis
wood-gas=Gas de madera
methanol=Metanol

[fluid-description]
pyrolysis-oil=Bioaceite oscuro y viscoso condensado a partir de los vapores de la pirólisis de madera. Puede sustituir a los derivados del petróleo crudo.
wood-gas=Mezcla gaseosa combustible de monóxido de carbono, hidrógeno e hidrocarburos ligeros liberada durante la pirólisis de madera.
methanol=Alcohol incoloro altamente inflamable obtenido por destilación de madera. Se usa como disolvente y materia prima para plásticos sintéticos y combustibles.

[technology-name]
wood-pyrolysis=Pirólisis de madera

[technology-description]
wood-pyrolysis=Desbloquea la descomposición térmica de la madera y la cadena química asociada — síntesis Fischer-Tropsch, destilación de bioaceite, síntesis de baquelita y conversión de metanol en combustible.

[recipe-name]
wood-pyrolysis=Pirólisis de madera
fischer-tropsch-synthesis=Síntesis Fischer-Tropsch
bio-oil-distillation=Destilación de bioaceite
methanol-plastic=Síntesis de baquelita
methanol-solid-fuel=Metanol a combustible

[recipe-description]
wood-pyrolysis=Descompone térmicamente la madera en ausencia de oxígeno para producir biocarbón, aceite de pirólisis y gas de madera.
fischer-tropsch-synthesis=Convierte catalíticamente el gas de síntesis (CO e H₂ del gas de madera) en hidrocarburos líquidos. El proceso Fischer-Tropsch se utiliza industrialmente desde la década de 1920 para producir combustibles a partir de materias primas no petroleras.
bio-oil-distillation=Destilación fraccionada del ácido piroleñoso (alquitrán de madera). Separa las fracciones pesadas del alquitrán de la fracción soluble en agua rica en metanol y ácido acético, como se practicaba en la industria de destilación de madera del siglo XIX.
methanol-plastic=Produce una resina fenol-formaldehído tipo baquelita. El metanol se oxida a formaldehído, que después se condensa con fenoles del alquitrán de hulla, formando el primer plástico totalmente sintético, inventado por Leo Baekeland en 1907.
methanol-solid-fuel=Convierte el metanol en un combustible sintético denso mediante el proceso metanol a gasolina (MTG), desarrollado por Mobil en la década de 1970. El metanol se deshidrata sobre un catalizador de zeolita produciendo hidrocarburos aptos como combustible sólido.

[factoriopedia-description]
biochar=Sólido carbonoso producto de la pirólisis lenta de biomasa. Más allá de su valor combustible, el biocarbón se ha usado durante siglos como enmienda del suelo.
pyrolysis-oil=Bioaceite ácido complejo con cientos de compuestos. Se requiere destilación antes de que pueda sustituir a las fracciones del petróleo crudo.
wood-gas=El gas de madera impulsó millones de vehículos en Europa durante la Segunda Guerra Mundial cuando la gasolina estaba racionada. Como gas de síntesis alimenta directamente la síntesis Fischer-Tropsch.
methanol=El alcohol más simple y un bloque químico versátil — convertible en plástico mediante síntesis de baquelita o en combustible sólido mediante el proceso MTG de Mobil.
tech-wood-pyrolysis=La pirólisis de madera precede a la petroquímica moderna por siglos. Esta investigación abre una rama química alternativa completa basada en la madera como materia prima renovable.
recipe-wood-pyrolysis=La pirólisis industrial se realiza a 400-600 °C en retortas selladas: entra biomasa, salen biocarbón, aceite y gas. La ausencia de oxígeno impide la combustión y fuerza la descomposición.
recipe-fischer-tropsch-synthesis=Inventada en 1925; usada por Alemania en la Segunda Guerra Mundial y por Sudáfrica durante las sanciones del apartheid para fabricar combustibles líquidos a partir de gas de síntesis derivado de carbón y biomasa.
recipe-bio-oil-distillation=El nombre histórico «ácido piroleñoso» refleja el alto contenido de ácido acético separado durante la destilación fraccionada del aceite de pirólisis.
recipe-methanol-plastic=El metanol se oxida a formaldehído, que condensa con fenoles (aquí representados por carbón) — la química detrás de la baquelita de Leo Baekeland (1907), el primer plástico totalmente sintético.
recipe-methanol-solid-fuel=El proceso MTG de Mobil (1976) hace pasar metanol por un catalizador de zeolita ZSM-5 a ~370 °C, produciendo hidrocarburos del rango de la gasolina que solidifican en combustible.
