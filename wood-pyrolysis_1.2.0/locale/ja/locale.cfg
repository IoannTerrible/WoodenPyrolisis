[item-name]
biochar=バイオ炭

[item-description]
biochar=木材の熱分解によって生成される炭素豊富な固体燃料。石炭と同様に燃焼します。

[fluid-name]
pyrolysis-oil=熱分解油
wood-gas=木質ガス
methanol=メタノール

[fluid-description]
pyrolysis-oil=木材熱分解の蒸気から凝縮された暗色で粘性のあるバイオオイル。原油誘導体の代替となり得ます。
wood-gas=木材熱分解の際に放出される一酸化炭素、水素、軽質炭化水素からなる可燃性ガス混合物。
methanol=木材の蒸留から得られる無色で非常に引火性の高いアルコール。溶剤や合成プラスチック・燃料の原料として用いられます。

[technology-name]
wood-pyrolysis=木材熱分解

[technology-description]
wood-pyrolysis=木材の熱分解と関連する化学チェーン全体——フィッシャー・トロプシュ合成、バイオオイル蒸留、ベークライト合成、メタノールから燃料への変換——を解放します。

[recipe-name]
wood-pyrolysis=木材熱分解
fischer-tropsch-synthesis=フィッシャー・トロプシュ合成
bio-oil-distillation=バイオオイル蒸留
methanol-plastic=ベークライト合成
methanol-solid-fuel=メタノールから燃料

[recipe-description]
wood-pyrolysis=酸素のない条件下で木材を熱分解し、バイオ炭、熱分解油、木質ガスを生成します。
fischer-tropsch-synthesis=合成ガス（木質ガス由来のCOとH₂）を触媒で液体炭化水素に変換します。フィッシャー・トロプシュ法は1920年代以降、非石油原料から燃料を製造するために工業的に使用されてきました。
bio-oil-distillation=木酢液（木タール）の分留。重いタール分を、メタノールと酢酸を多く含む水溶性画分から分離します。19世紀の木材蒸留産業で行われていた手法です。
methanol-plastic=ベークライト型のフェノールホルムアルデヒド樹脂を生成します。メタノールはホルムアルデヒドに酸化され、コールタール中のフェノール類と縮合し、1907年にレオ・ベークランドが発明した最初の完全合成プラスチックを形成します。
methanol-solid-fuel=Mobil社が1970年代に開発したメタノール・トゥ・ガソリン（MTG）プロセスで、メタノールを高密度の合成燃料に変換します。メタノールはゼオライト触媒上で脱水され、固体燃料に適した炭化水素を生成します。

[factoriopedia-description]
biochar=バイオマスの緩慢熱分解によって生成される炭状の固体。燃料価値に加え、現実の世界では何世紀にもわたり土壌改良材として使用されてきました。
pyrolysis-oil=数百種類の化合物を含む複雑な酸性バイオオイル。原油画分の代替とするには蒸留が必要です。
wood-gas=ガソリンが配給制だった第二次世界大戦中のヨーロッパで、木質ガスは数百万台の車両を動かしました。合成ガスとしてフィッシャー・トロプシュ合成に直接供給できます。
methanol=最も単純なアルコールであり、汎用的な化学原料——ベークライト合成でプラスチックに、Mobil MTGプロセスで固体燃料に変換できます。
tech-wood-pyrolysis=木材熱分解は現代の石油化学に何世紀も先行しています。この研究は、再生可能原料としての木材を中心に据えた完全な代替化学ツリーを開きます。
recipe-wood-pyrolysis=工業的な熱分解は密閉レトルト内で400〜600 °Cで行われます——バイオマスが入り、バイオ炭、油、ガスが出てきます。酸素がないため燃焼せず、分解が起こります。
recipe-fischer-tropsch-synthesis=1925年に発明され、第二次世界大戦時のドイツやアパルトヘイト制裁下の南アフリカで、石炭やバイオマス由来の合成ガスから液体燃料を製造するために使用されました。
recipe-bio-oil-distillation=歴史的名称「木酢酸」は、熱分解油の分留中に分離される酢酸含量の高さを反映しています。
recipe-methanol-plastic=メタノールはホルムアルデヒドに酸化され、フェノール類（ここでは石炭で代用）と縮合します——レオ・ベークランドの1907年のベークライト、最初の完全合成プラスチックの背後にある化学です。
recipe-methanol-solid-fuel=Mobil社のMTGプロセス（1976年）は、約370 °CでZSM-5ゼオライト触媒上にメタノールを通し、燃料として固化するガソリン範囲の炭化水素を生成します。
