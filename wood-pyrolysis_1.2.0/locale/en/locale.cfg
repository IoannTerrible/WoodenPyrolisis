[fluid-description]
pyrolysis-oil=A dark, viscous bio-oil condensed from wood pyrolysis vapours. Can substitute for crude-oil derivatives.
wood-gas=A combustible gas mixture of CO, hydrogen, and light hydrocarbons released during wood pyrolysis.
methanol=A highly flammable, colourless alcohol derived from wood distillation. Used as a solvent and precursor to synthetic plastics and fuels.

[technology-name]
wood-pyrolysis=Wood Pyrolysis

[technology-description]
wood-pyrolysis=Unlocks thermal decomposition of wood and the downstream chemistry chain — Fischer-Tropsch synthesis, bio-oil distillation, Bakelite synthesis, and methanol-to-fuel conversion.

[recipe-name]
wood-pyrolysis=Wood Pyrolysis
fischer-tropsch-synthesis=Fischer-Tropsch Synthesis
bio-oil-distillation=Bio-Oil Distillation
methanol-plastic=Bakelite Synthesis
methanol-solid-fuel=Methanol-to-Fuel

[recipe-description]
wood-pyrolysis=Thermally decompose wood in the absence of oxygen to yield biochar, pyrolysis oil, and wood gas.
fischer-tropsch-synthesis=Catalytically converts syngas (CO and H₂ from wood gas) into liquid hydrocarbons. The Fischer-Tropsch process was used industrially since the 1920s to synthesise fuels from non-petroleum feedstocks.
bio-oil-distillation=Fractional distillation of pyroligneous acid (wood tar). Separates the heavy tar fractions from the water-soluble fraction rich in methanol and acetic acid, as practised in 19th-century wood-distillation industry.
methanol-plastic=Produces Bakelite-like phenol-formaldehyde resin. Methanol is oxidised to formaldehyde, which then condenses with phenols present in coal tar to form the first fully synthetic plastic, invented by Leo Baekeland in 1907.
methanol-solid-fuel=Converts methanol into a dense synthetic fuel via the Methanol-to-Gasoline (MTG) process, developed by Mobil in the 1970s. Methanol is dehydrated over a zeolite catalyst to produce hydrocarbons suitable as solid fuel.

[factoriopedia-description]
biochar=A charcoal-like solid produced by slow pyrolysis of biomass. In addition to its fuel value, real-world biochar has long been used as a soil amendment.
pyrolysis-oil=A complex acidic bio-oil containing hundreds of compounds. Distillation is required before it can substitute for crude-oil fractions.
wood-gas=Wood gas powered millions of vehicles in WW2 Europe when petrol was rationed. As a syngas it feeds directly into Fischer-Tropsch synthesis.
methanol=The simplest alcohol and a versatile chemical building block — convertible to plastic via Bakelite synthesis or to solid fuel via the Mobil MTG process.
tech-wood-pyrolysis=Wood pyrolysis predates modern petroleum chemistry by centuries. Researching this opens a full alternative chemistry tree built around wood as a renewable feedstock.
recipe-wood-pyrolysis=Industrial pyrolysis runs at 400-600 °C in sealed retorts: biomass enters; biochar, oil, and gas leave. The absence of oxygen prevents combustion and forces decomposition instead.
recipe-fischer-tropsch-synthesis=Invented in 1925; used by Germany in WW2 and apartheid-era South Africa to manufacture liquid fuels from coal- and biomass-derived syngas.
recipe-bio-oil-distillation=The historical name "pyroligneous acid" reflects the high acetic acid content separated out during fractional distillation of pyrolysis oil.
recipe-methanol-plastic=Methanol oxidises to formaldehyde, which condenses with phenols (here proxied by coal) — the chemistry behind Leo Baekeland's 1907 Bakelite, the first fully synthetic plastic.
recipe-methanol-solid-fuel=Mobil's MTG process (1976) passes methanol over a ZSM-5 zeolite catalyst at ~370 °C, yielding gasoline-range hydrocarbons that solidify into fuel.
