[item-name]
biochar=Pflanzenkohle

[item-description]
biochar=Ein kohlenstoffreicher Festbrennstoff aus der Pyrolyse von Holz. Brennt ähnlich wie Kohle.

[fluid-name]
pyrolysis-oil=Pyrolyseöl
wood-gas=Holzgas
methanol=Methanol

[fluid-description]
pyrolysis-oil=Ein dunkles, zähflüssiges Bioöl, kondensiert aus den Dämpfen der Holzpyrolyse. Kann Erdölderivate ersetzen.
wood-gas=Ein brennbares Gasgemisch aus Kohlenmonoxid, Wasserstoff und leichten Kohlenwasserstoffen, das bei der Holzpyrolyse freigesetzt wird.
methanol=Ein leicht entzündlicher, farbloser Alkohol aus der Holzdestillation. Verwendet als Lösungsmittel und Vorprodukt für Kunststoffe und Treibstoffe.

[technology-name]
wood-pyrolysis=Holzpyrolyse

[technology-description]
wood-pyrolysis=Schaltet die thermische Zersetzung von Holz und die nachgelagerte Chemie frei — Fischer-Tropsch-Synthese, Bioöl-Destillation, Bakelit-Synthese und Methanol-zu-Treibstoff.

[recipe-name]
wood-pyrolysis=Holzpyrolyse
fischer-tropsch-synthesis=Fischer-Tropsch-Synthese
bio-oil-distillation=Bioöl-Destillation
methanol-plastic=Bakelit-Synthese
methanol-solid-fuel=Methanol zu Treibstoff

[recipe-description]
wood-pyrolysis=Zersetzt Holz unter Luftabschluss thermisch zu Pflanzenkohle, Pyrolyseöl und Holzgas.
fischer-tropsch-synthesis=Wandelt Synthesegas (CO und H₂ aus Holzgas) katalytisch in flüssige Kohlenwasserstoffe um. Das Fischer-Tropsch-Verfahren wird seit den 1920er Jahren industriell zur Herstellung von Treibstoffen aus nicht-petrochemischen Rohstoffen genutzt.
bio-oil-distillation=Fraktionierte Destillation von Holzessig (Pyroligninsäure). Trennt schwere Teerfraktionen von dem wasserlöslichen, methanol- und essigsäurereichen Anteil, wie in der Holzdestillationsindustrie des 19. Jahrhunderts üblich.
methanol-plastic=Erzeugt ein Phenol-Formaldehyd-Harz vom Typ Bakelit. Methanol wird zu Formaldehyd oxidiert, das mit Phenolen aus Steinkohlenteer kondensiert — der erste vollsynthetische Kunststoff, 1907 von Leo Baekeland erfunden.
methanol-solid-fuel=Wandelt Methanol nach dem Methanol-to-Gasoline-Verfahren (MTG, Mobil, 1970er) in einen dichten synthetischen Treibstoff um. Methanol wird an einem Zeolith-Katalysator dehydratisiert und ergibt feste, brennstofftaugliche Kohlenwasserstoffe.

[factoriopedia-description]
biochar=Kohleähnlicher Feststoff aus langsamer Pyrolyse von Biomasse. Neben dem Brennwert wird Pflanzenkohle seit Jahrhunderten als Bodenverbesserer eingesetzt.
pyrolysis-oil=Ein komplexes saures Bioöl mit Hunderten von Verbindungen. Vor dem Einsatz als Erdölersatz ist eine Destillation nötig.
wood-gas=Holzgas trieb im Zweiten Weltkrieg Millionen Fahrzeuge in Europa an, als Benzin rationiert war. Als Synthesegas wandert es direkt in die Fischer-Tropsch-Synthese.
methanol=Der einfachste Alkohol und ein vielseitiger Chemiebaustein — wird per Bakelit-Synthese zu Kunststoff oder per Mobil-MTG-Verfahren zu festem Treibstoff.
tech-wood-pyrolysis=Holzpyrolyse ist der modernen Petrochemie um Jahrhunderte voraus. Diese Forschung öffnet einen vollständigen alternativen Chemiebaum auf Basis von Holz als nachwachsendem Rohstoff.
recipe-wood-pyrolysis=Industrielle Pyrolyse läuft bei 400-600 °C in geschlossenen Retorten: Biomasse hinein, Pflanzenkohle, Öl und Gas heraus. Ohne Sauerstoff verbrennt das Holz nicht, sondern zersetzt sich.
recipe-fischer-tropsch-synthesis=Erfunden 1925; im Zweiten Weltkrieg von Deutschland und während der Apartheid-Sanktionen von Südafrika genutzt, um aus Kohle- und Biomasse-Synthesegas flüssige Treibstoffe herzustellen.
recipe-bio-oil-distillation=Der historische Name „Holzessigsäure" verweist auf den hohen Anteil an Essigsäure, der bei der fraktionierten Destillation des Pyrolyseöls abgetrennt wird.
recipe-methanol-plastic=Methanol oxidiert zu Formaldehyd, das mit Phenolen (hier durch Kohle vertreten) kondensiert — die Chemie hinter Leo Baekelands Bakelit von 1907, dem ersten vollsynthetischen Kunststoff.
recipe-methanol-solid-fuel=Mobils MTG-Verfahren (1976) leitet Methanol bei ~370 °C über einen ZSM-5-Zeolithkatalysator und liefert Kohlenwasserstoffe im Benzinbereich, die zu Festbrennstoff verfestigen.
