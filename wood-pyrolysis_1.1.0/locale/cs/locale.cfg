[item-name]
biochar=Biouhel

[item-description]
biochar=Tuhé palivo s vysokým obsahem uhlíku, získané pyrolýzou dřeva. Hoří podobně jako uhlí.

[fluid-name]
pyrolysis-oil=Pyrolýzní olej
wood-gas=Dřevní plyn
methanol=Metanol

[fluid-description]
pyrolysis-oil=Tmavý viskózní bioolej zkondenzovaný z par při pyrolýze dřeva. Může nahradit deriváty ropy.
wood-gas=Hořlavá plynná směs oxidu uhelnatého, vodíku a lehkých uhlovodíků uvolňovaná při pyrolýze dřeva.
methanol=Vysoce hořlavý bezbarvý alkohol získaný suchou destilací dřeva. Používá se jako rozpouštědlo a surovina pro syntetické plasty a paliva.

[technology-name]
wood-pyrolysis=Pyrolýza dřeva

[technology-description]
wood-pyrolysis=Odemkne tepelný rozklad dřeva a navazující chemický řetězec — Fischer-Tropschovu syntézu, destilaci biooleje, syntézu bakelitu a přeměnu metanolu na palivo.

[recipe-name]
wood-pyrolysis=Pyrolýza dřeva
fischer-tropsch-synthesis=Fischer-Tropschova syntéza
bio-oil-distillation=Destilace biooleje
methanol-plastic=Syntéza bakelitu
methanol-solid-fuel=Metanol na palivo

[recipe-description]
wood-pyrolysis=Tepelně rozkládá dřevo bez přístupu kyslíku na biouhel, pyrolýzní olej a dřevní plyn.
fischer-tropsch-synthesis=Katalyticky převádí syntézní plyn (CO a H₂ z dřevního plynu) na kapalné uhlovodíky. Fischer-Tropschův proces se průmyslově využívá od 20. let 20. století k výrobě paliv z neropných surovin.
bio-oil-distillation=Frakční destilace pyrolýzní kyseliny (dřevního dehtu). Odděluje těžké dehtové frakce od ve vodě rozpustného podílu bohatého na metanol a kyselinu octovou, jak se to dělalo v lesochemickém průmyslu 19. století.
methanol-plastic=Vyrábí fenolformaldehydovou pryskyřici typu bakelit. Metanol se oxiduje na formaldehyd, který kondenzuje s fenoly z černouhelného dehtu — první plně syntetický plast, vynalezený Leo Baekelandem v roce 1907.
methanol-solid-fuel=Přeměňuje metanol na hutné syntetické palivo procesem methanol-to-gasoline (MTG), vyvinutým firmou Mobil v 70. letech 20. století. Metanol se dehydratuje na zeolitovém katalyzátoru za vzniku uhlovodíků vhodných jako tuhé palivo.
