[item-name]
biochar=Биоуголь

[item-description]
biochar=Богатое углеродом твёрдое топливо, получаемое при пиролизе древесины. Горит подобно углю.

[fluid-name]
pyrolysis-oil=Пиролизное масло
wood-gas=Древесный газ
methanol=Метанол

[fluid-description]
pyrolysis-oil=Тёмное вязкое биомасло, конденсат паров пиролиза древесины. Может заменять производные сырой нефти.
wood-gas=Горючая газовая смесь из угарного газа, водорода и лёгких углеводородов, выделяющаяся при пиролизе древесины.
methanol=Легковоспламеняющийся бесцветный спирт, получаемый сухой перегонкой древесины. Используется как растворитель и сырьё для синтетических пластмасс и топлива.

[technology-name]
wood-pyrolysis=Пиролиз древесины

[technology-description]
wood-pyrolysis=Открывает термическое разложение древесины и сопутствующую химическую цепочку — синтез Фишера—Тропша, перегонку биомасла, синтез бакелита и преобразование метанола в топливо.

[recipe-name]
wood-pyrolysis=Пиролиз древесины
fischer-tropsch-synthesis=Синтез Фишера—Тропша
bio-oil-distillation=Перегонка биомасла
methanol-plastic=Синтез бакелита
methanol-solid-fuel=Метанол в топливо

[recipe-description]
wood-pyrolysis=Термически разлагает древесину в отсутствие кислорода, давая биоуголь, пиролизное масло и древесный газ.
fischer-tropsch-synthesis=Каталитически превращает синтез-газ (CO и H₂ из древесного газа) в жидкие углеводороды. Процесс Фишера—Тропша промышленно применяется с 1920-х годов для получения топлива из ненефтяного сырья.
bio-oil-distillation=Фракционная перегонка пиролигненовой кислоты (древесной смолы). Отделяет тяжёлые смоляные фракции от водорастворимой части, богатой метанолом и уксусной кислотой, как это делали в лесохимической промышленности XIX века.
methanol-plastic=Производит фенолформальдегидную смолу типа бакелита. Метанол окисляется до формальдегида, который затем конденсируется с фенолами каменноугольной смолы, образуя первую полностью синтетическую пластмассу, изобретённую Лео Бакеландом в 1907 году.
methanol-solid-fuel=Превращает метанол в плотное синтетическое топливо по процессу «метанол в бензин» (MTG), разработанному компанией Mobil в 1970-х годах. Метанол дегидратируется на цеолитном катализаторе с образованием углеводородов, пригодных как твёрдое топливо.
