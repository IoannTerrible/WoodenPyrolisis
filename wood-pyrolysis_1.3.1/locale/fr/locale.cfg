[item-name]
biochar=Biochar

[item-description]
biochar=Combustible solide riche en carbone produit par pyrolyse du bois. Brûle de manière similaire au charbon.

[fluid-name]
pyrolysis-oil=Huile de pyrolyse
wood-gas=Gaz de bois
methanol=Méthanol

[fluid-description]
pyrolysis-oil=Bio-huile sombre et visqueuse, condensée à partir des vapeurs de pyrolyse du bois. Peut remplacer les dérivés du pétrole brut.
wood-gas=Mélange gazeux combustible de monoxyde de carbone, d'hydrogène et d'hydrocarbures légers libérés lors de la pyrolyse du bois.
methanol=Alcool incolore très inflammable obtenu par distillation du bois. Utilisé comme solvant et matière première pour les plastiques synthétiques et les carburants.

[technology-name]
wood-pyrolysis=Pyrolyse du bois

[technology-description]
wood-pyrolysis=Débloque la décomposition thermique du bois et toute la chaîne chimique associée — synthèse Fischer-Tropsch, distillation de bio-huile, synthèse de la bakélite et conversion du méthanol en carburant.

[recipe-name]
wood-pyrolysis=Pyrolyse du bois
fischer-tropsch-synthesis=Synthèse Fischer-Tropsch
bio-oil-distillation=Distillation de bio-huile
methanol-plastic=Synthèse de la bakélite
methanol-solid-fuel=Méthanol en carburant

[recipe-description]
wood-pyrolysis=Décompose thermiquement le bois en l'absence d'oxygène pour produire biochar, huile de pyrolyse et gaz de bois.
fischer-tropsch-synthesis=Convertit catalytiquement le gaz de synthèse (CO et H₂ issus du gaz de bois) en hydrocarbures liquides. Le procédé Fischer-Tropsch est utilisé industriellement depuis les années 1920 pour produire des carburants à partir de matières premières non pétrolières.
bio-oil-distillation=Distillation fractionnée de l'acide pyroligneux (goudron de bois). Sépare les fractions lourdes du goudron de la fraction soluble dans l'eau, riche en méthanol et en acide acétique, comme dans l'industrie de la distillation du bois du XIXe siècle.
methanol-plastic=Produit une résine phénol-formaldéhyde de type bakélite. Le méthanol est oxydé en formaldéhyde, qui se condense ensuite avec les phénols du goudron de houille pour former le premier plastique entièrement synthétique, inventé par Leo Baekeland en 1907.
methanol-solid-fuel=Convertit le méthanol en un carburant synthétique dense par le procédé méthanol-essence (MTG), développé par Mobil dans les années 1970. Le méthanol est déshydraté sur un catalyseur de zéolithe pour produire des hydrocarbures utilisables comme combustible solide.

[factoriopedia-description]
biochar=Solide noir issu de la pyrolyse lente de la biomasse. Au-delà de sa valeur combustible, le biochar est utilisé depuis des siècles comme amendement des sols.
pyrolysis-oil=Bio-huile acide complexe contenant des centaines de composés. Une distillation est nécessaire avant qu'elle puisse remplacer les fractions du pétrole brut.
wood-gas=Le gaz de bois a alimenté des millions de véhicules en Europe pendant la Seconde Guerre mondiale, lorsque l'essence était rationnée. Comme gaz de synthèse, il alimente directement la synthèse Fischer-Tropsch.
methanol=L'alcool le plus simple et un composant chimique polyvalent — convertible en plastique par synthèse de la bakélite ou en combustible solide par le procédé MTG de Mobil.
tech-wood-pyrolysis=La pyrolyse du bois précède la pétrochimie moderne de plusieurs siècles. Cette recherche ouvre une chaîne chimique alternative complète bâtie sur le bois comme matière première renouvelable.
recipe-wood-pyrolysis=La pyrolyse industrielle se déroule à 400-600 °C dans des cornues hermétiques : la biomasse entre, biochar, huile et gaz sortent. L'absence d'oxygène empêche la combustion et force la décomposition.
recipe-fischer-tropsch-synthesis=Inventé en 1925 ; utilisé par l'Allemagne pendant la Seconde Guerre mondiale et par l'Afrique du Sud sous embargo de l'apartheid pour fabriquer des carburants liquides à partir de gaz de synthèse issus du charbon ou de la biomasse.
recipe-bio-oil-distillation=Le nom historique « acide pyroligneux » reflète la forte teneur en acide acétique séparée lors de la distillation fractionnée de l'huile de pyrolyse.
recipe-methanol-plastic=Le méthanol s'oxyde en formaldéhyde qui se condense avec les phénols (ici représentés par le charbon) — la chimie de la bakélite de Leo Baekeland (1907), premier plastique entièrement synthétique.
recipe-methanol-solid-fuel=Le procédé MTG de Mobil (1976) fait passer le méthanol sur un catalyseur de zéolithe ZSM-5 à environ 370 °C, produisant des hydrocarbures de type essence solidifiables en combustible.
