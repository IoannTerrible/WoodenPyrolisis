[item-name]
biochar=生物炭

[item-description]
biochar=由木材热解产生的富碳固体燃料，燃烧特性与煤相似。

[fluid-name]
pyrolysis-oil=热解油
wood-gas=木煤气
methanol=甲醇

[fluid-description]
pyrolysis-oil=由木材热解蒸气冷凝而成的深色黏稠生物油。可替代原油衍生物。
wood-gas=木材热解过程中释放的可燃气体混合物，含一氧化碳、氢气和轻质烃类。
methanol=由木材干馏获得的高度易燃无色醇类。用作溶剂以及合成塑料和燃料的前体原料。

[technology-name]
wood-pyrolysis=木材热解

[technology-description]
wood-pyrolysis=解锁木材的热分解及其下游化学链——费托合成、生物油蒸馏、酚醛塑料合成以及甲醇制燃料。

[recipe-name]
wood-pyrolysis=木材热解
fischer-tropsch-synthesis=费托合成
bio-oil-distillation=生物油蒸馏
methanol-plastic=酚醛塑料合成
methanol-solid-fuel=甲醇制燃料

[recipe-description]
wood-pyrolysis=在无氧条件下热分解木材，产生生物炭、热解油和木煤气。
fischer-tropsch-synthesis=通过催化反应将合成气（来自木煤气的CO和H₂）转化为液态烃。费托工艺自1920年代以来一直被工业界用于从非石油原料生产燃料。
bio-oil-distillation=对木醋液（木焦油）进行分馏。将重质焦油馏分与富含甲醇和乙酸的水溶性馏分分离，正如19世纪木材蒸馏工业所采用的工艺。
methanol-plastic=生产酚醛树脂型酚醛塑料。甲醇被氧化为甲醛，然后与煤焦油中的酚类缩合，形成由利奥·贝克兰于1907年发明的第一种完全合成塑料。
methanol-solid-fuel=通过Mobil公司在1970年代开发的甲醇制汽油（MTG）工艺将甲醇转化为高密度合成燃料。甲醇在沸石催化剂上脱水生成适合作固体燃料的烃类。

[factoriopedia-description]
biochar=由生物质缓慢热解产生的类炭固体。除了燃料价值外，现实中的生物炭已被用作土壤改良剂数个世纪。
pyrolysis-oil=含有数百种化合物的复杂酸性生物油。在替代原油馏分之前需要进行蒸馏。
wood-gas=二战时期燃油配给制下的欧洲，木煤气曾驱动数百万辆汽车。作为合成气，它可直接进入费托合成。
methanol=最简单的醇类，也是用途广泛的化学原料——可通过酚醛塑料合成转化为塑料，或通过Mobil MTG工艺转化为固体燃料。
tech-wood-pyrolysis=木材热解比现代石油化学早数个世纪。研究此项技术将开启一条以木材为可再生原料的完整替代化学链。
recipe-wood-pyrolysis=工业热解在密闭蒸馏釜中以400-600 °C进行：生物质进入，生物炭、油和气体产出。无氧环境阻止燃烧，迫使木材分解。
recipe-fischer-tropsch-synthesis=发明于1925年；二战中的德国及种族隔离制裁时期的南非曾用其从煤炭和生物质合成气制取液态燃料。
recipe-bio-oil-distillation=历史名称"木醋酸"反映了在热解油分馏过程中分离出的高乙酸含量。
recipe-methanol-plastic=甲醇氧化为甲醛，与酚类（此处由煤替代）缩合——这就是利奥·贝克兰1907年酚醛塑料背后的化学，世界上第一种完全合成塑料。
recipe-methanol-solid-fuel=Mobil公司的MTG工艺（1976年）在约370 °C下将甲醇通过ZSM-5沸石催化剂，生成可固化为燃料的汽油范围烃类。
